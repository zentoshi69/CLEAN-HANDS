# ⚠️ LEGACY (2026-07-03): this vhost belongs to the retired nginx-edge setup.
# Production serves cleanhands through the box's single shared edge proxy to
# the docker container `cleanhands-api` (host debug port 127.0.0.1:18090).
# Do not enable this on a box whose 80/443 is owned by another edge.
# See .claude/skills/vps-deploy-safety/SKILL.md and /root/INFRA.md.
#
# cleanhands.fun — static landing + same-origin API proxy to the staking backend.
# Install: cp to /etc/nginx/sites-available/clean-site ; certbot manages 443.
server {
    listen 80;
    listen [::]:80;
    server_name cleanhands.fun www.cleanhands.fun;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cleanhands.fun www.cleanhands.fun;
    ssl_certificate /etc/letsencrypt/live/cleanhands.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cleanhands.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/clean-site;
    index index.html;
    # live data + assets + white paper come from the app backend, same-origin.
    # We OVERWRITE X-Forwarded-For with the real peer ($remote_addr) so a client
    # can't spoof it — the backend's rate limiter trusts XFF only from this local
    # proxy (RL_TRUSTED_PROXIES). X-Forwarded-Proto lets the app know it's https.
    location ~ ^/(api/|whitepaper(\.js)?$|glove\.png$|banner\.png$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host app.cleanhands.fun;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Back-end RPC calls are capped at ~18 s total (see asyncio.wait_for in
        # app.py). 25 s gives the Python layer time to finish and still lets nginx
        # return a proper 504 before the browser's own ~30 s fetch timeout fires.
        proxy_read_timeout 25s;
        proxy_connect_timeout 5s;
        # (no add_header here: the backend sets its own CSP/HSTS for these)
    }
    # Static landing + shop CHECKOUT page. This page renders the treasury address
    # and the solana: pay URI, so it needs anti-clickjacking + a CSP. Headers live
    # in this location block (not server-wide) so proxied API responses above keep
    # the backend's own security headers instead of being double-set.
    location / {
        # serve pretty URLs: /boost -> /boost.html
        try_files $uri $uri.html $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Inline-heavy static page -> 'unsafe-inline' for script/style (parity with
        # the app CSP). frame-ancestors 'none' blocks address-overlay clickjacking;
        # script-src pins remote code to self + the (CDN) QR lib only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
